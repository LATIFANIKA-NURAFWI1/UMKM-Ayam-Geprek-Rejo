services:
  # ── Web Service (Laravel App) ────────────────────────────────────────────────
  - type: web
    name: geprek-rejo
    runtime: php
    plan: free            # Ganti ke "starter" atau "standard" untuk production
    region: singapore     # Pilih server terdekat (singapore paling dekat ke Indonesia)
    buildCommand: "chmod +x ./render-build.sh && ./render-build.sh"
    startCommand: "php artisan serve --host=0.0.0.0 --port=$PORT"
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: "Ayam Geprek Rejo"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true    # Render otomatis generate APP_KEY
      - key: APP_URL
        value: https://geprek-rejo.onrender.com   # Ganti setelah deploy
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql           # Render pakai PostgreSQL
      - key: DB_HOST
        fromDatabase:
          name: geprek-rejo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: geprek-rejo-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: geprek-rejo-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: geprek-rejo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: geprek-rejo-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

  # ── PostgreSQL Database ──────────────────────────────────────────────────────
databases:
  - name: geprek-rejo-db
    plan: free              # Free tier: 1GB, max 97 koneksi, 90 hari (gratis)
    region: singapore
    databaseName: geprek_rejo
    user: geprek_user
