services:
  # ── Web Service (Laravel App) ────────────────────────────────────────────────
  - type: web
    name: geprek-rejo
    runtime: php
    plan: free            # Ganti ke "starter" atau "standard" untuk production
    region: singapore     # Pilih server terdekat (singapore paling dekat ke Indonesia)
    buildCommand: "chmod +x ./render-build.sh && ./render-build.sh"
    startCommand: "php artisan serve --host=0.0.0.0 --port=$PORT"
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: "Ayam Geprek Rejo"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true    # Render otomatis generate APP_KEY
      - key: APP_URL
        value: https://geprek-rejo.onrender.com   # Ganti setelah deploy
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

      # ── Database: MySQL dari Aiven.io ──────────────────────────────────────
      - key: DB_CONNECTION
        value: mysql           # ← Tetap MySQL! Tidak perlu ubah migration
      - key: DB_HOST
        sync: false            # Isi manual dari dashboard Aiven
      - key: DB_PORT
        sync: false            # Port dari Aiven (biasanya 5-digit, bukan 3306)
      - key: DB_DATABASE
        sync: false            # Nama database dari Aiven (biasanya "defaultdb")
      - key: DB_USERNAME
        sync: false            # Username dari Aiven (biasanya "avnadmin")
      - key: DB_PASSWORD
        sync: false            # Password dari Aiven

      # SSL wajib untuk Aiven MySQL
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt

      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

# Tidak perlu blok "databases:" karena pakai Aiven eksternal

