<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Buat Voucher Baru</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f7f9ff",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#c0000b",
                        "on-surface": "#181c20",
                        "primary-fixed-dim": "#ffb4aa",
                        "on-secondary-container": "#6c5000",
                        "tertiary-container": "#737576",
                        "on-secondary-fixed": "#261a00",
                        "outline": "#936e69",
                        "inverse-surface": "#2d3135",
                        "tertiary-fixed": "#e1e3e4",
                        "surface-bright": "#f7f9ff",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#410001",
                        "tertiary-fixed-dim": "#c5c7c8",
                        "background": "#f7f9ff",
                        "surface-container": "#ebeef3",
                        "primary-container": "#e61919",
                        "outline-variant": "#e8bcb6",
                        "on-tertiary-fixed": "#191c1d",
                        "on-tertiary": "#ffffff",
                        "primary": "#bc000a",
                        "inverse-primary": "#ffb4aa",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#930006",
                        "inverse-on-surface": "#eef1f6",
                        "secondary": "#785900",
                        "surface-variant": "#e0e3e8",
                        "on-primary-container": "#fffbff",
                        "tertiary": "#5a5c5e",
                        "on-secondary-fixed-variant": "#5b4300",
                        "secondary-container": "#fdc003",
                        "on-surface-variant": "#5e3f3b",
                        "on-tertiary-fixed-variant": "#454748",
                        "surface-dim": "#d7dadf",
                        "secondary-fixed": "#ffdf9e",
                        "surface-container-high": "#e5e8ee",
                        "surface-container-highest": "#e0e3e8",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#ffdad5",
                        "on-tertiary-container": "#fcfdfe",
                        "surface-container-low": "#f1f4f9",
                        "secondary-fixed-dim": "#fabd00",
                        "on-background": "#181c20",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "24px",
                        "card-gap": "16px",
                        "base": "8px",
                        "section-margin": "32px"
                    },
                    "fontFamily": {
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "order-number": ["Plus Jakarta Sans"],
                        "label-caps": ["Inter"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "order-number": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e0e3e8;
            border-radius: 4px;
        }
        
        /* Smooth transitions */
        .input-transition {
            transition: all 0.2s ease-in-out;
        }
        
        /* Toggle Switch Custom CSS */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #bc000a;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #bc000a;
        }
        
        /* Hide number input arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface antialiased w-full min-h-screen flex flex-col md:max-w-md md:mx-auto md:shadow-2xl md:border-x md:border-surface-variant relative">
<!-- Top App Bar (Customized for Transactional Form Modal Context) -->
<header class="w-full top-0 sticky z-40 bg-surface-container-lowest border-b border-surface-variant shadow-sm flex justify-between items-center px-4 h-16 w-full">
<button class="text-on-surface-variant hover:bg-surface-container-high transition-colors p-2 rounded-full active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Buat Voucher Baru</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Form Content Canvas -->
<main class="flex-1 overflow-y-auto pb-32">
<div class="p-container-padding space-y-card-gap">
<!-- Kode Voucher Field -->
<div class="form-group">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-base flex items-center gap-1 uppercase">
                    Kode Voucher <span class="text-primary">*</span>
</label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-transparent rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-tertiary input-transition focus:bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none uppercase" id="kode-voucher" placeholder="Contoh: GEPREKMERDEKA" type="text">
<!-- Real-time Validation Feedback Container (Hidden by default, shown via JS if needed) -->
<span class="material-symbols-outlined text-primary absolute right-3 top-3 hidden" id="kode-error-icon" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<!-- Tipe Diskon Dropdown -->
<div class="form-group">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-base block uppercase">
                        Tipe Diskon
                    </label>
<div class="relative">
<select class="w-full bg-surface-container-low border border-transparent rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface appearance-none input-transition focus:bg-surface-container-lowest focus:border-secondary-container focus:ring-1 focus:ring-secondary-container focus:outline-none pr-10">
<option value="nominal">Nominal (Rp)</option>
<option value="persentase">Persentase (%)</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 text-tertiary pointer-events-none">expand_more</span>
</div>
</div>
<!-- Nilai Diskon Input -->
<div class="form-group">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-base block uppercase">
                        Nilai Diskon
                    </label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-low border border-transparent rounded-lg pl-4 pr-12 py-3 font-body-md text-body-md text-on-surface input-transition focus:bg-surface-container-lowest focus:border-secondary-container focus:ring-1 focus:ring-secondary-container focus:outline-none" placeholder="0" type="number">
<span class="absolute right-4 font-body-md text-body-md text-on-surface-variant font-medium pointer-events-none">Rp</span>
</div>
</div>
</div>
<!-- Min. Pembelian Input -->
<div class="form-group">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-base block uppercase">
                    Min. Pembelian
                </label>
<div class="relative flex items-center">
<span class="absolute left-4 font-body-md text-body-md text-on-surface-variant font-medium pointer-events-none">Rp</span>
<input class="w-full bg-surface-container-low border border-transparent rounded-lg pl-12 pr-4 py-3 font-body-md text-body-md text-on-surface input-transition focus:bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none" placeholder="0" type="number">
</div>
</div>
<!-- Maks. Penggunaan Input -->
<div class="form-group">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-base block uppercase">
                    Maks. Penggunaan (Kuota)
                </label>
<input class="w-full bg-surface-container-low border border-transparent rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-tertiary input-transition focus:bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none" placeholder="Contoh: 100" type="number">
</div>
<!-- Periode Date Range -->
<div class="form-group">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-base block uppercase">
                    Periode Berlaku
                </label>
<div class="flex items-center gap-2">
<div class="relative flex-1">
<input class="w-full bg-surface-container-low border border-transparent rounded-lg px-3 py-3 font-body-md text-body-md text-on-surface input-transition focus:bg-surface-container-lowest focus:border-secondary-container focus:ring-1 focus:ring-secondary-container focus:outline-none appearance-none" type="date">
</div>
<span class="text-tertiary font-body-md">-</span>
<div class="relative flex-1">
<input class="w-full bg-surface-container-low border border-transparent rounded-lg px-3 py-3 font-body-md text-body-md text-on-surface input-transition focus:bg-surface-container-lowest focus:border-secondary-container focus:ring-1 focus:ring-secondary-container focus:outline-none appearance-none" type="date">
</div>
</div>
</div>
<!-- Divider -->
<hr class="border-surface-variant my-6">
<!-- Toggle Aktifkan Voucher -->
<div class="flex items-center justify-between mt-4 bg-surface-container-low p-4 rounded-xl">
<div>
<h3 class="font-body-lg text-body-lg text-on-surface">Aktifkan Voucher</h3>
<p class="font-body-md text-body-md text-tertiary text-sm mt-1">Voucher dapat digunakan pelanggan.</p>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-surface-container-lowest border-4 border-surface-variant appearance-none cursor-pointer z-10 transition-transform duration-300 ease-in-out" id="toggle" name="toggle" type="checkbox">
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-variant cursor-pointer transition-colors duration-300 ease-in-out" for="toggle"></label>
</div>
</div>
</div>
</main>
<!-- Bottom Action Bar -->
<div class="fixed bottom-0 w-full md:max-w-md bg-surface-container-lowest shadow-[0_-4px_16px_rgba(0,0,0,0.05)] px-container-padding py-4 z-50 rounded-t-xl border-t border-surface-variant">
<div class="flex gap-4">
<button class="flex-1 font-headline-md text-headline-md text-on-surface-variant border border-surface-variant rounded-lg py-3 hover:bg-surface-container-high transition-colors active:scale-95">
                Batal
            </button>
<button class="flex-1 font-headline-md text-headline-md text-on-primary bg-primary rounded-lg py-3 hover:bg-on-primary-fixed-variant transition-colors shadow-sm active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">save</span>
                Simpan
            </button>
</div>
<div class="pb-safe"></div> <!-- iOS Safe Area padding support -->
</div>
</body></html>
