<!DOCTYPE html>
<html lang="id" style="">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Pesanan Berhasil - Modern Culinary</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;700&amp;display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#454748",
                        "surface": "#f7f9ff",
                        "secondary-fixed": "#ffdf9e",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e5e8ee",
                        "surface-dim": "#d7dadf",
                        "primary": "#bc000a",
                        "on-background": "#181c20",
                        "outline": "#936e69",
                        "error": "#ba1a1a",
                        "tertiary": "#5a5c5e",
                        "surface-bright": "#f7f9ff",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#e61919",
                        "on-primary-container": "#fffbff",
                        "primary-fixed": "#ffdad5",
                        "outline-variant": "#e8bcb6",
                        "tertiary-fixed": "#e1e3e4",
                        "error-container": "#ffdad6",
                        "on-primary-fixed": "#410001",
                        "on-error": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-variant": "#e0e3e8",
                        "on-tertiary-fixed": "#191c1d",
                        "on-secondary-container": "#6c5000",
                        "inverse-on-surface": "#eef1f6",
                        "on-surface-variant": "#5e3f3b",
                        "on-secondary-fixed": "#261a00",
                        "tertiary-fixed-dim": "#c5c7c8",
                        "inverse-surface": "#2d3135",
                        "secondary": "#785900",
                        "surface-tint": "#c0000b",
                        "surface-container-low": "#f1f4f9",
                        "tertiary-container": "#737576",
                        "secondary-container": "#fdc003",
                        "surface-container": "#ebeef3",
                        "on-secondary-fixed-variant": "#5b4300",
                        "on-tertiary-container": "#fcfdfe",
                        "primary-fixed-dim": "#ffb4aa",
                        "surface-container-highest": "#e0e3e8",
                        "background": "#f7f9ff",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#ffb4aa",
                        "secondary-fixed-dim": "#fabd00",
                        "on-surface": "#181c20",
                        "on-primary-fixed-variant": "#930006"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "card-gap": "16px",
                        "base": "8px",
                        "container-padding": "24px",
                        "section-margin": "32px"
                    },
                    "fontFamily": {
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-caps": ["Inter"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "order-number": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"],
                        "body-lg": ["Plus Jakarta Sans"]
                    }
                },
            },
        };
    </script>
    <style>
        /* -webkit-tap-highlight-color tidak tersedia sebagai Tailwind utility */
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body
    class="bg-surface font-headline-md dark:bg-inverse-surface text-on-surface dark:text-inverse-on-surface min-h-screen transition-colors duration-300">
    <div class="max-w-md mx-auto min-h-screen flex flex-col pb-6">
        <!-- Header -->
        <div class="pt-10 pb-6 flex flex-col items-center text-center px-6">
            <div class="w-20 h-20 bg-tertiary/10 rounded-full flex items-center justify-center mb-4">
                <div class="w-14 h-14 bg-tertiary-container rounded-full flex items-center justify-center text-white"
                    style="background-color: rgb(16, 185, 129);">
                    <span class="material-icons-round text-3xl">check</span>
                </div>
            </div>
            <h1 class="text-headline-lg mb-1 whitespace-nowrap">
                Pesanan Berhasil! 🎉
            </h1>
            <p class="text-body-md text-on-surface-variant dark:text-tertiary-fixed-dim whitespace-nowrap">
                Pesanan Anda sedang diproses oleh dapur
            </p>
        </div>
        <!-- Order Number (Queue) -->
        <div class="px-6 mb-4">
            <div class="bg-primary-container rounded-xl p-6 text-center text-white shadow-lg relative overflow-hidden">
                <p class="text-label-caps opacity-90 mb-1 whitespace-nowrap uppercase">Nomor Antrean Anda</p>
                <div class="text-order-number mb-1 text-6xl font-extrabold">9</div>

            </div>
        </div>
        <!-- Status Badges -->
        <div class="px-6 grid grid-cols-3 gap-3 mb-4">
            <div
                class="bg-surface-container-lowest dark:bg-surface-container-high/10 p-3 rounded-lg border border-outline-variant/30 text-center shadow-sm">
                <p class="text-[8px] font-bold text-on-surface-variant dark:text-tertiary-fixed-dim uppercase mb-0.5">
                    Pesanan</p>
                <p class="text-[8px] font-medium truncate">GR-20280607-0009</p>
            </div>
            <div
                class="bg-surface-container-lowest dark:bg-surface-container-high/10 p-3 rounded-lg border border-outline-variant/30 text-center shadow-sm">
                <p class="text-[8px] font-bold text-on-surface-variant dark:text-tertiary-fixed-dim uppercase mb-0.5">
                    Jenis</p>
                <p class="text-[8px] font-medium whitespace-nowrap">🥡 Bawa Pulang</p>
            </div>
            <div
                class="bg-surface-container-lowest dark:bg-surface-container-high/10 p-3 rounded-lg border border-outline-variant/30 text-center shadow-sm">
                <p class="text-[8px] font-bold text-on-surface-variant dark:text-tertiary-fixed-dim uppercase mb-0.5">
                    Bayar</p>
                <p class="text-[8px] font-medium whitespace-nowrap">📱 QRIS</p>
            </div>
        </div>
        <!-- Customer Info -->
        <div class="px-6 mb-4">
            <div
                class="bg-surface-container-lowest dark:bg-surface-container-high/10 p-3 rounded-lg border border-outline-variant/30 flex items-center gap-3 shadow-sm">
                <div
                    class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-white text-xs font-bold">
                    A</div>
                <p class="text-body-lg font-bold whitespace-nowrap capitalize">ajeng</p>
            </div>
        </div>
        <!-- Order Details Card -->
        <div class="px-6 mb-6 flex-1">
            <div
                class="bg-surface-container-lowest dark:bg-surface-container-high/10 rounded-xl border border-outline-variant/30 shadow-sm overflow-hidden h-full flex flex-col">
                <div class="p-4 border-b border-outline-variant/20 flex items-center gap-2">
                    <span class="material-icons-round text-primary-container text-xl">receipt_long</span>
                    <h2 class="text-headline-md whitespace-nowrap">Detail Pesanan</h2>
                </div>
                <div class="p-4 flex-1">
                    <!-- Item Row: Single Line -->
                    <div
                        class="flex items-center gap-3 py-3 border-b border-surface-container-high dark:border-surface-container-high/10">
                        <div
                            class="w-12 h-12 bg-surface-container-low dark:bg-surface-container-highest/20 rounded-lg flex items-center justify-center shrink-0">
                            <span class="text-2xl">🍗</span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-xs font-bold truncate">Ayam Geprek Banyumas</p>
                            <p class="text-xs text-on-surface-variant dark:text-tertiary-fixed-dim">1 × Rp 14.000</p>
                        </div>
                        <div class="text-body-lg font-bold whitespace-nowrap">Rp 14.000</div>
                    </div>
                    <!-- Summary -->
                    <div class="mt-4 space-y-3">
                        <div
                            class="flex justify-between items-center text-body-md text-on-surface-variant dark:text-tertiary-fixed-dim whitespace-nowrap">
                            <span class="">Subtotal</span>
                            <span class="">Rp 14.000</span>
                        </div>
                        <div class="flex justify-between items-center pt-2 border-t border-outline-variant/20">
                            <span class="text-body-lg font-bold whitespace-nowrap">Total Dibayar</span>
                            <span class="text-headline-lg text-primary-container whitespace-nowrap">Rp 14.000</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Action Button -->
        <div class="px-6 mt-auto">
            <button
                class="w-full bg-primary-container hover:opacity-90 active:scale-[0.98] transition-all py-4 rounded-xl text-white font-bold flex items-center justify-center gap-2 shadow-lg">
                <span class="material-icons-round text-xl">add</span>
                <span class="text-body-lg font-bold whitespace-nowrap">Pesan Lagi</span>
            </button>
        </div>
    </div>
    <!-- Theme Toggle -->
    <div class="fixed bottom-4 right-4">
        <button
            class="p-3 bg-surface-container-lowest dark:bg-surface-container-high rounded-full shadow-lg border border-outline-variant/30 flex items-center justify-center"
            onclick="document.documentElement.classList.toggle('dark')">
            <span class="material-icons-round text-on-surface-variant dark:text-inverse-on-surface">dark_mode</span>
        </button>
    </div>


</body>

</html>
